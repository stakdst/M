<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Pattern 10000</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // 1模様あたりのサイズ
    const cellSize = 3; // 1px＋マージン代わり
    const patternSize = 10 * cellSize;

    // 表示サイズを自動調整
    const cols = 100; // 横に並べる数
    const rows = 100; // 縦に並べる数（合計100x100=10000）
    canvas.width = cols * patternSize;
    canvas.height = rows * patternSize;

    function drawPattern(x, y) {
      for (let j = 0; j < 10; j++) {
        for (let i = 0; i < 10; i++) {
          if (j === 9 || i === 9) {
            ctx.fillStyle = "blue";
          } else {
            ctx.fillStyle = "red";
          }
          ctx.fillRect(
            x + i * cellSize,
            y + j * cellSize,
            cellSize - 0.5,
            cellSize - 0.5
          );
        }
      }
    }

    // 10000模様を描画
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        drawPattern(col * patternSize, row * patternSize);
      }
    }
  </script>
</body>
</html>
